# Publishing a version: change the number in VERSION (and "version" in package.json), commit, then
# Actions -> Release -> Run workflow. It builds the program package for the laser box and publishes it as release
# v<VERSION>. Boxes find it by themselves and offer the update.
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  box:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Read the version
        run: |
          V="$(tr -d '\r\n' < VERSION)"
          [ "$V" = "$(node -p "require('./package.json').version")" ] || { echo "::error::VERSION and package.json disagree"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
          if gh release view "v$V" >/dev/null 2>&1; then echo "::error::Release v$V already exists. Change VERSION first."; exit 1; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm test
      - run: bash scripts/make-box.sh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" out/ember-box-*.tar.gz out/ember-box-*.tar.gz.sha256 \
            --target "$GITHUB_SHA" --title "Ember v$V" --generate-notes
